[project]
name = "codmon-photos"
version = "0.1.0"
description = "Download nursery photo albums from Codmon at the best resolution the CDN allows."
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ngoc Do", email = "ngochust56@gmail.com" }]
dependencies = [
    "piexif>=1.1.3",
    "python-dotenv>=1.2.4",
    "smbprotocol>=1.17.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]