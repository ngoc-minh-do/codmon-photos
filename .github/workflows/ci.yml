name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uvx ruff check scripts --select E,F,I,UP,B --ignore E501
      - run: uv run python -m py_compile scripts/*.py